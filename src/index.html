<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PEYT Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="theme-mask"></div>
    <div class="theme-effect"></div>
    <div id="app"></div>
    <!-- macOS Overlay 标题栏:红黄绿三色按钮的拖拽区(仅 macOS 显示,见 styles.css) -->
    <div id="window-drag-region" data-tauri-drag-region></div>
    <!-- 顶栏工具栏:VSCode 式居中搜索条(点击打开全局搜索) -->
    <div id="titlebar-tools">
      <button id="titlebar-search" title="全局搜索">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>搜索消息、联系人、频道…</span>
      </button>
    </div>
    <!-- Windows/Linux 自绘窗口控制(最小化/最大化/关闭);macOS 用原生红绿灯 -->
    <div id="window-controls">
      <button class="wc-btn" data-wc="min" title="最小化"><span>─</span></button>
      <button class="wc-btn" data-wc="max" title="最大化"><span>□</span></button>
      <button class="wc-btn wc-close" data-wc="close" title="关闭"><span>✕</span></button>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
