<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PEYT Chat</title>
    <!-- 主题 preload:首帧前应用持久化主题/字号,避免闪变(opencode oc-theme-preload 同思路) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('peyt.theme');
          if (t && t !== 'nowint') document.documentElement.setAttribute('data-theme', t);
          var f = localStorage.getItem('peyt.fontScale');
          if (f && f !== 'md') document.documentElement.setAttribute('data-font-scale', f);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="theme-mask"></div>
    <div class="theme-effect"></div>
    <!-- 启动 splash:shell 渲染前显示,脉冲 logo(opencode LoadingSplash 同思路) -->
    <div id="boot-splash">
      <img src="/logo.jpg" alt="PEYT Chat" draggable="false" />
    </div>
    <div id="app"></div>
    <!-- 无边框窗口标题栏:
         - macOS (window-overlay): 纯拖拽区,原生红绿灯悬浮在左端,隐藏 logo/标题/控制按钮(见 styles.css)
         - Windows/Linux (window-frame): 自绘标题栏 — 左「PEYT Chat」,右最小化/最大化/关闭
         登录页与主界面共用此条(固定覆盖顶部 34px)。 -->
    <div id="window-drag-region" data-tauri-drag-region>
      <img class="wb-logo" src="/logo.jpg" alt="PEYT Chat" draggable="false" />
      <div class="wb-title" data-tauri-drag-region>PEYT Chat</div>
      <div class="wb-controls">
        <button id="wb-min" class="wb-btn" title="最小化" aria-label="最小化">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 6h7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
        <button id="wb-max" class="wb-btn" title="最大化" aria-label="最大化">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="2" y="2" width="8" height="8" rx="1.6" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button id="wb-close" class="wb-btn wb-close" title="关闭" aria-label="关闭">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <!-- 顶栏工具栏:VSCode 式居中搜索条(点击打开全局搜索,macOS 与 Windows 都有) -->
    <div id="titlebar-tools">
      <button id="titlebar-search" title="全局搜索">
        <span class="ts-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
        <span class="ts-text">搜索消息、联系人、频道…</span>
        <kbd id="ts-kbd">⌘K</kbd>
      </button>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
