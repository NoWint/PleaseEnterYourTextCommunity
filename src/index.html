<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PEYT Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="theme-mask"></div>
    <div class="theme-effect"></div>
    <div id="app"></div>
    <!-- 无边框窗口标题栏:
         - macOS (window-overlay): 纯拖拽区,原生红绿灯悬浮在左端(见 styles.css)
         - Windows/Linux (window-frame): 自绘标题栏 — 左「PEYT Chat」,右最小化/最大化/关闭
         登录页与主界面共用此条(固定覆盖顶部 40px)。 -->
    <div id="window-drag-region" data-tauri-drag-region>
      <img class="wb-logo" src="/logo.jpg" alt="PEYT Chat" draggable="false" />
      <div class="wb-title" data-tauri-drag-region>PEYT Chat</div>
      <div class="wb-controls">
        <button id="wb-min" class="wb-btn" title="最小化" aria-label="最小化">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 5.5H9.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
        </button>
        <button id="wb-max" class="wb-btn" title="最大化" aria-label="最大化">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><rect x="1.5" y="1.5" width="8" height="8" stroke="currentColor" stroke-width="1.1"/></svg>
        </button>
        <button id="wb-close" class="wb-btn wb-close" title="关闭" aria-label="关闭">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 2L9 9M9 2L2 9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
