[package]
name = "peytchat"
version = "0.1.0"
edition = "2021"

[lib]
name = "peytchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
portable-pty = "0.8"
deltachat = { path = "../core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
zip = "2"
base64 = "0.22"
env_logger = "0.11"
log = "0.4"
urlencoding = "2"
# netwatch 0.5.0 (transitive via deltachat->iroh) uses socket2::Type::RAW, which
# is gated behind socket2 0.5's `all` feature. Core's workspace enables `all`
# transitively via hyper-util; peytchat builds deltachat standalone without that
# unification, so enable `all` explicitly here.
socket2 = { version = "0.5", features = ["all"] }
rusqlite = "0.37"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
