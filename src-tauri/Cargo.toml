[package]
name = "peytchat"
version = "0.1.0"
edition = "2021"

[lib]
name = "peytchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
deltachat = { path = "../core" }
# 深链:注册自定义 URI scheme(OPENPGP4FPR/dcaccount/dclogin),复刻 i.delta.chat 唤起。
# single-instance 用于把深链转发给已运行实例(Windows 插件只在新进程读 argv)。
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
zip = "2"
base64 = "0.22"
# Windows/macOS/Linux 原生系统通知(对齐 Delta Chat 桌面端 user-notify 架构),
# 替代浏览器 Notification API —— 原生通知由 Rust 侧 WinRT/UNUserNotificationCenter/DBus 发送,
# 不依赖 webview 的 Notification.requestPermission()。
user-notify = "0.4.1"
env_logger = "0.11"
log = "0.4"
urlencoding = "2"
# netwatch 0.5.0 (transitive via deltachat->iroh) uses socket2::Type::RAW, which
# is gated behind socket2 0.5's `all` feature. Core's workspace enables `all`
# transitively via hyper-util; peytchat builds deltachat standalone without that
# unification, so enable `all` explicitly here.
socket2 = { version = "0.5", features = ["all"] }
rusqlite = "0.37"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }

# Windows:无边框标题栏子类化窗口过程,在最大化按钮区域返回 HTMAXBUTTON
# 以触发 Win11 原生 snap layout 分组弹窗。版本与 tauri 2.11 的 windows crate 一致
# (HWND 类型直接兼容)。
[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"
