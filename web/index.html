<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="点开邀请链接,在 PEYT 上开始私密对话">
    <meta property="og:type" content="website">
    <meta property="og:title" content="PEYT · 私密对话">
    <meta property="og:url" content="https://peyt.yzjtiantian.cn">
    <meta name="theme-color" content="#0d0d12">
    <link rel="icon" href="logo.jpg">
    <title>PEYT · 私密对话</title>
    <script src="./qrcode.min.js"></script>
    <style>
        /* ── 设计系统 ──────────────────────────────── */
        :root {
            /* Telegram 风格白底邀请页 */
            --bg-0: #ffffff;
            --bg-1: #f4f6f8;
            --glass: rgba(0, 0, 0, 0.04);
            --glass-strong: rgba(0, 0, 0, 0.07);
            --stroke: rgba(0, 0, 0, 0.10);
            --stroke-strong: rgba(0, 0, 0, 0.20);
            --text: #1c1c1e;
            --text-2: #5e6670;
            --text-3: #9aa1a9;
            --accent: #2aabee; /* Telegram 蓝 */
            --accent-2: #229ed9;
            --gap: 33px; /* 统一间距(×1.5) */
            --radius-xl: 42px;
            --radius-md: 21px;
            --shadow-lg: 0 24px 60px rgba(0,0,0,0.12);
            --ease-spring: cubic-bezier(0.2, 0.9, 0.3, 1.1);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg-0); } /* html 兜底:渐变未覆盖区域也是深色,不露白 */
        body {
            font-family: var(--font);
            color: var(--text);
            /* Telegram 风格:白底 */
            background: var(--bg-0);
            min-height: 100%;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        /* 顶部极淡蓝光晕 + 柔和网格(白底,Telegram 清爽)。 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(80% 60% at 50% -10%, rgba(42, 171, 238, 0.08) 0%, transparent 75%),
                radial-gradient(1px 1px at 20% 30%, rgba(0,0,0,0.05) 0%, transparent 100%),
                radial-gradient(1px 1px at 80% 70%, rgba(0,0,0,0.04) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            width: min(100%, 690px);
            /* 初始内容停在视口约 1/3 处(margin-top 让位,顶部留白美观) */
            margin-top: 13vh;
            padding: 0 24px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: page-in 600ms var(--ease-spring) both;
        }
        @keyframes page-in {
            from { opacity: 0; transform: translateY(16px) scale(0.985); }
            to   { opacity: 1; transform: none; }
        }

        /* ── 品牌区:左 LOGO,右上 PEYT Chat,右下 Type Everything ── */
        .brand-block {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: var(--gap);
        }
        .brand-block .logo {
            flex: none;
            width: 84px; height: 84px;
            border-radius: 24px;
            object-fit: cover;
            box-shadow: 0 10px 28px rgba(0,0,0,0.5);
            animation: logo-in 700ms var(--ease-spring) 80ms both;
        }
        @keyframes logo-in {
            from { opacity: 0; transform: scale(0.6) translateY(-8px); }
            to   { opacity: 1; transform: none; }
        }
        .brand-text {
            display: flex;
            flex-direction: column;
            text-align: left;
            line-height: 1.2;
        }
        /* 品牌名:大号主体,与 hero 呼应(§15 层级主) */
        .brand {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -0.015em;
            color: var(--text);
        }
        /* slogan:品牌声音,弱化但清晰 */
        .slogan {
            margin-top: 3px;
            font-size: 21px;
            color: var(--text-2);
            letter-spacing: 0.02em;
        }

        /* ── 问候区:hero 独立居中 ─────────────────── */
        .greeting {
            text-align: center;
            margin: var(--gap) 0 var(--gap);
        }
        .hello {
            font-size: clamp(42px, 7.5vw, 51px);
            font-weight: 700;
            letter-spacing: -0.022em;
            line-height: 1.18;
            white-space: nowrap; /* 强制单行,避免 51px 字号下文字被挤成两行 */
        }
        .hello b {
            color: var(--accent);
        }

        /* ── 卡片:材料层 ─────────────────────────── */
        /* 主容器:无卡片包裹,整体融入背景(无背景/边框/圆角/阴影) */
        .card {
            width: 100%;
            padding: 0;
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            animation: card-in 600ms var(--ease-spring) 180ms both;
        }
        /* 有 token:左右布局 — 左 QR,右 打开/下载 */
        .card-invite {
            display: flex;
            align-items: center;
            gap: var(--gap);
            width: 100%;
        }
        .card-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: var(--gap);
        }
        @keyframes card-in {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to   { opacity: 1; transform: none; }
        }

        /* ── 主 CTA:打开 PEYT ─────────────────────── */
        .cta {
            display: flex;
            align-items: center;
            justify-content: space-between; /* 文字左、箭头右 */
            gap: 10px;
            width: 100%; /* 横向填充右侧整行 */
            padding: 20px 28px;
            border: none;
            border-radius: var(--radius-md);
            /* Telegram 主按钮:蓝底 + 白字 */
            background: var(--accent);
            color: #fff;
            font-family: inherit;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(42,171,238,0.35);
            transition: transform 120ms var(--ease-spring), box-shadow 200ms var(--ease-spring), filter 150ms;
            text-decoration: none;
        }
        .cta:hover { filter: brightness(1.05); box-shadow: 0 12px 32px rgba(42,171,238,0.45); }
        .cta:active { transform: scale(0.97); }
        .cta svg { width: 30px; height: 30px; }
        .cta .cta-arrow { transition: transform 150ms var(--ease-spring); }
        .cta:hover .cta-arrow { transform: translateX(3px); }

        /* ── 次级:下载按钮(与 CTA 一样大,文字左、icon 右)── */
        .download {
            display: flex;
            align-items: center;
            justify-content: space-between; /* 文字左、下载 icon 右,对齐 CTA */
            gap: 6px;
            width: 100%; /* 与 CTA 同宽 */
            padding: 20px 28px; /* 与 CTA 同 padding */
            border-radius: var(--radius-md);
            background: var(--glass-strong);
            border: none;
            color: var(--text);
            font-size: 26px; /* 与 CTA 同字号 */
            font-weight: 600;
            text-decoration: none;
            transition: background 120ms, color 120ms, transform 120ms var(--ease-spring);
        }
        .download:hover { background: var(--glass); transform: translateY(-1px); }
        .download .dl-icon { width: 30px; height: 30px; flex: none; }

        /* ── 二维码(受邀/生成器共用)────────── */
        .qr-body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #qrcode, #qrcode-gen { display: inline-flex; }
        #qrcode canvas, #qrcode-gen canvas { display: block; border-radius: 10px; border: 1px solid var(--stroke); }
        #qr-body-gen {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: var(--gap);
        }

        /* 窄屏:卡片退回纵向 */
        @media (max-width: 600px) {
            .card-invite { flex-direction: column; }
            .card-right { align-items: center; text-align: center; }
        }

        /* ── 生成器(并入左栏)────────────── */
        .generator {
            display: none;
            width: 100%;
            margin-top: 6px;
            align-self: stretch; /* 撑满左栏,textarea 才能 100% */
        }
        .generator.open { display: block; animation: qr-in 320ms var(--ease-spring) both; }
        /* 胶囊容器:输入框 + 按钮融为一体(§12 材料克制,无边/微融合)。
           纵向布局下占满宽,居中显示 */
        .gen-row {
            display: flex;
            align-items: center;
            width: 100%;
            /* 无间隙:按钮与输入框同底色,视觉一体 */
            gap: 0;
            padding: 12px 12px 12px 33px; /* 更宽内边距,呼吸感 */
            border: none;
            border-radius: 42px; /* 胶囊型大圆角 */
            background: rgba(0, 0, 0, 0.05); /* Telegram 浅灰输入框 */
            transition: box-shadow 200ms var(--ease-spring), background 200ms var(--ease-spring);
            box-sizing: border-box;
        }
        /* focus-within:容器整体泛起 Telegram 蓝光晕(输入框或按钮获得焦点时) */
        .gen-row:focus-within {
            background: rgba(0, 0, 0, 0.05);
            box-shadow: 0 0 0 3px rgba(42, 171, 238, 0.35), 0 0 24px rgba(42, 171, 238, 0.18);
        }
        .generator input {
            flex: 1;
            min-height: 66px;
            padding: 0;
            border: none;
            background: transparent; /* 融入 gen-row 底色 */
            color: var(--text);
            /* 字体与 hero「向 TA 打个招呼」一致:系统无衬线,非等宽 */
            font-family: var(--font);
            font-size: 26px;
            line-height: 1.5;
            outline: none;
            box-sizing: border-box;
        }
        .generator input::placeholder { color: var(--text-3); }
        /* 极简确认按钮:透明无边框,与输入框同底色融合,仅图标 */
        .gen-btn {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 66px;
            height: 66px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-2);
            cursor: pointer;
            transition: border-color 120ms, color 120ms, background 120ms, transform 120ms var(--ease-spring);
        }
        .gen-btn svg { width: 33px; height: 33px; }
        .gen-btn:hover { color: var(--accent); background: rgba(42,171,238,0.12); }
        .gen-btn:active { transform: scale(0.92); }
        .gen-btn:disabled { opacity: 0.35; cursor: default; background: none; }

        /* ── 响应式 ─────────────────────────────── */
        @media (max-width: 480px) {
            .page { padding: 44px 20px 32px; }
            /* 窄屏降字号,保证 hello 单行不溢出 */
            .hello { font-size: 30px; }
            .card { padding: 22px 18px; }
        }

        /* ── 减弱动效 ───────────────────────────── */
        @media (prefers-reduced-motion: reduce) {
            .page, .logo, .card, .qr-body, .generator { animation: none; }
            .cta, .cta .cta-arrow, .download { transition: none; }
        }
    </style>
</head>
<body>
    <main class="page">
        <!-- 品牌区:左 LOGO,右上 PEYT Chat,右下 Type Everything -->
        <div class="brand-block">
            <img class="logo" src="logo.jpg" alt="PEYT">
            <div class="brand-text">
                <div class="brand">PEYT Chat</div>
                <p class="slogan">Type Everything</p>
            </div>
        </div>

        <!-- 问候:hero 独立居中 -->
        <div class="greeting">
            <h1 class="hello">向 <b id="name">TA</b> 打个招呼 👋</h1>
        </div>

        <div class="card" id="card">
            <!-- 有 token(受邀):左右布局 — 左 QR,右 打开/下载 -->
            <div class="card-invite" id="card-invite">
                <div class="qr-body" id="qr-body">
                    <div id="qrcode"></div>
                </div>
                <div class="card-right">
                    <!-- CTA:文字左、箭头右,横向填充整行 -->
                    <a class="cta" id="dc-link" href="">
                        <span class="cta-text">打开 PEYT Chat</span>
                        <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </a>
                    <!-- 下载按钮:与 CTA 一样大,文字左、下载 icon 右 -->
                    <a class="download" id="download-link" href="https://github.com/NoWint/PleaseEnterYourTextCommunity/releases" target="_blank" rel="noopener">
                        <span class="dl-text">还没有？点击下载</span>
                        <svg class="dl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                    </a>
                </div>
            </div>
            <!-- 无 token:生成器(粘贴链接 → 生成二维码) -->
            <div class="card-generator" id="card-generator">
                <div class="generator" id="generator">
                    <div class="gen-row">
                        <input id="gen-input" type="text" placeholder="粘贴邀请链接,生成二维码" autocomplete="off" spellcheck="false">
                        <button class="gen-btn" id="gen-btn" aria-label="生成二维码">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                        </button>
                    </div>
                </div>
                <div class="qr-body" id="qr-body-gen" style="display:none">
                    <div id="qrcode-gen"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 无 JS 兜底
        if (!window.QRCode) document.body.classList.add('no-js');

        var searchParams = new URLSearchParams(window.location.hash.substr(1));
        var nameEl = document.getElementById('name');
        var ctaEl = document.getElementById('dc-link');
        var downloadEl = document.getElementById('download-link');
        var cardInvite = document.getElementById('card-invite');
        var cardGenerator = document.getElementById('card-generator');
        // 有 token:受邀 QR;无 token:生成器 QR
        var qrEl = document.getElementById('qrcode');
        var qrGenEl = document.getElementById('qrcode-gen');
        var genEl = document.getElementById('generator');

        function renderQr(container, token) {
            var openpgp4fprStr = "OPENPGP4FPR:" + token.replace(/&/, "#");
            container.innerHTML = '';
            var cv = document.createElement('canvas');
            container.appendChild(cv);
            QRCode.toCanvas(cv, openpgp4fprStr, { width: 260, margin: 1 });
        }

        function renderInvite(token) {
            // `<FPR>&v=3&i=...` → `OPENPGP4FPR:<FPR>#v=3&i=...`
            ctaEl.setAttribute('href', "OPENPGP4FPR:" + token.replace(/&/, "#"));
            nameEl.textContent = searchParams.get("g") || searchParams.get("b") || searchParams.get("n") || searchParams.get("a") || "TA";
            renderQr(qrEl, token);
        }

        var token = window.location.hash.substr(1);
        if (token) {
            // 有 token(受邀方):左右布局 — 左 QR,右 打开/下载;隐藏生成器
            cardGenerator.style.display = 'none';
            cardInvite.style.display = 'flex';
            renderInvite(token);
        } else {
            // 无 token:生成器模式;隐藏受邀区
            cardInvite.style.display = 'none';
            cardGenerator.style.display = 'block';
            genEl.classList.add('open');
        }

        // 生成器:确认按钮 + 回车都触发(点击或按 Enter 生成二维码)
        var genInput = document.getElementById('gen-input');
        var genBtn = document.getElementById('gen-btn');
        genBtn.disabled = true; // 空输入禁用
        function generate() {
            var v = genInput.value.trim();
            if (!v) { genBtn.disabled = true; return; }
            if (v.startsWith('https://peyt.yzjtiantian.cn')) v = v.replace(/https:\/\/peyt\.yzjtiantian\.cn\/?#/, '');
            else if (v.startsWith('https://i.delta.chat')) v = v.replace(/https:\/\/i\.delta\.chat\/?#/, '');
            else v = v.replace(/openpgp4fpr:/i, '');
            if (v.indexOf('#') === -1) v = v.replace(/%23/, '#');
            if (!v) { genBtn.disabled = true; return; }
            // 生成器路径:生成后隐藏问候语(位置让给二维码),显示生成器二维码
            var greeting = document.querySelector('.greeting');
            if (greeting) greeting.style.display = 'none';
            var genQrBody = document.getElementById('qr-body-gen');
            if (genQrBody) genQrBody.style.display = 'flex';
            renderQr(qrGenEl, v);
        }
        genBtn.addEventListener('click', generate);
        // 回车绑定:textarea 内按 Enter 生成
        genInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                generate();
            }
        });
        genInput.addEventListener('input', function () {
            genBtn.disabled = !genInput.value.trim();
        });
    </script>
</body>
</html>
