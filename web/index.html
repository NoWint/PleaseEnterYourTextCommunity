<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="点开邀请链接,在 PEYT 上开始私密对话">
    <meta property="og:type" content="website">
    <meta property="og:title" content="PEYT · 私密对话">
    <meta property="og:url" content="https://peyt.yzjtiantian.cn">
    <meta name="theme-color" content="#0d0d12">
    <link rel="icon" href="logo.jpg">
    <title>PEYT · 私密对话</title>
    <script src="./qrcode.min.js"></script>
    <style>
        /* ── 设计系统 ──────────────────────────────── */
        :root {
            --bg-0: #0d0d12;
            --bg-1: #16161e;
            --glass: rgba(255, 255, 255, 0.07);
            --glass-strong: rgba(255, 255, 255, 0.11);
            --stroke: rgba(255, 255, 255, 0.10);
            --stroke-strong: rgba(255, 255, 255, 0.22);
            --text: #f2f2f6;
            --text-2: #a1a1b0;
            --text-3: #6d6d7c;
            --accent: #6a5cff;
            --accent-2: #8b7bff;
            --radius-xl: 28px;
            --radius-md: 14px;
            --shadow-lg: 0 24px 60px rgba(0,0,0,0.45);
            --ease-spring: cubic-bezier(0.2, 0.9, 0.3, 1.1);
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg-0); } /* html 兜底:渐变未覆盖区域也是深色,不露白 */
        body {
            font-family: var(--font);
            color: var(--text);
            /* min-height:100vh 让 body 至少撑满整个视口;渐变 120% 相对 body 铺满,
               不会出现 body 只占一部分、下方露出 html 背景的"两段" */
            background: radial-gradient(120% 100vh at 50% 0%, #1b1b2a 0%, var(--bg-0) 72%);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* page 内容不足时垂直居中 */
            overflow-x: hidden;
        }
        /* 顶部紫色光晕 + 柔和网格(层次)。
           position:fixed 让光晕随视口固定(不随滚动错位),渐变撑满避免分界。 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(80% 60% at 50% -10%, rgba(106, 92, 255, 0.16) 0%, transparent 75%),
                radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.08) 0%, transparent 100%),
                radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,0.06) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            width: min(100%, 460px);
            padding: 64px 24px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: page-in 600ms var(--ease-spring) both;
        }
        @keyframes page-in {
            from { opacity: 0; transform: translateY(16px) scale(0.985); }
            to   { opacity: 1; transform: none; }
        }

        /* ── 品牌区:左 LOGO,右上 PEYT Chat,右下 Type Everything ── */
        .brand-block {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 16px;
        }
        .brand-block .logo {
            flex: none;
            width: 56px; height: 56px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 10px 28px rgba(106,92,255,0.35);
            animation: logo-in 700ms var(--ease-spring) 80ms both;
        }
        @keyframes logo-in {
            from { opacity: 0; transform: scale(0.6) translateY(-8px); }
            to   { opacity: 1; transform: none; }
        }
        .brand-text {
            display: flex;
            flex-direction: column;
            text-align: left;
            line-height: 1.2;
        }
        /* 品牌名:大号主体,与 hero 呼应(§15 层级主) */
        .brand {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.015em;
            color: var(--text);
        }
        /* slogan:品牌声音,弱化但清晰 */
        .slogan {
            margin-top: 3px;
            font-size: 14px;
            color: var(--text-2);
            letter-spacing: 0.02em;
        }

        /* ── 问候区:hero 独立居中 ─────────────────── */
        .greeting {
            text-align: center;
            margin: 22px 0 32px;
        }
        .hello {
            font-size: clamp(28px, 5vw, 34px);
            font-weight: 700;
            letter-spacing: -0.022em;
            line-height: 1.18;
        }
        .hello b {
            background: linear-gradient(120deg, var(--accent-2), #c9a2ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ── 卡片:材料层 ─────────────────────────── */
        /* 主容器:无卡片包裹,整体融入背景(无背景/边框/圆角/阴影) */
        .card {
            width: 100%;
            padding: 0;
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            animation: card-in 600ms var(--ease-spring) 180ms both;
        }
        @keyframes card-in {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to   { opacity: 1; transform: none; }
        }

        /* 提示行:把编号步骤压缩成一句(§16 简洁性) */
        .hint {
            text-align: center;
            font-size: 13px;
            color: var(--text-3);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* ── 主 CTA:打开 PEYT ─────────────────────── */
        .cta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 17px 20px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            color: #fff;
            font-family: inherit;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(106,92,255,0.4);
            transition: transform 120ms var(--ease-spring), box-shadow 200ms var(--ease-spring), filter 150ms;
            text-decoration: none;
        }
        .cta:hover { filter: brightness(1.08); box-shadow: 0 12px 32px rgba(106,92,255,0.5); }
        .cta:active { transform: scale(0.97); }
        .cta svg { width: 20px; height: 20px; }
        .cta .cta-arrow { transition: transform 150ms var(--ease-spring); }
        .cta:hover .cta-arrow { transform: translateX(3px); }

        /* ── 次级:下载 PEYT(幽灵胶囊,不抢主 CTA)── */
        .download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 12px auto 0;
            width: fit-content;
            padding: 9px 18px;
            border-radius: 999px;
            background: var(--glass-strong);
            border: 1px solid var(--stroke);
            color: var(--text-2);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: background 120ms, color 120ms, transform 120ms var(--ease-spring);
        }
        .download:hover { background: var(--glass); color: var(--text); transform: translateY(-1px); }
        .download svg { width: 14px; height: 14px; }

        /* ── 二维码区:纵向布局(生成器在上,二维码在下)────────── */
        .qr-wrap {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        /* 生成器区:纵向,子项撑满(generator 拉宽),标题/切换自居中 */
        .qr-left {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
        }
        .qr-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            align-self: center;
            letter-spacing: -0.01em;
        }
        .qr-toggle { align-self: center; }
        .qr-toggle {
            border: none;
            background: var(--glass-strong);
            color: var(--text-2);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 10px 22px;
            border-radius: 999px;
            transition: background 120ms, color 120ms;
        }
        .qr-toggle:hover { background: var(--glass); color: var(--text); }
        .qr-toggle svg { vertical-align: -2px; margin-right: 6px; }
        /* 右栏:二维码(无卡片,融入背景) */
        .qr-body {
            flex: none;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .qr-body.open { display: flex; animation: qr-in 320ms var(--ease-spring) both; }
        @keyframes qr-in {
            from { opacity: 0; transform: scale(0.94) translateY(6px); }
            to   { opacity: 1; transform: none; }
        }
        /* 二维码 canvas:白底保证可扫,无卡片包裹、融入背景 */
        #qrcode { display: inline-flex; }
        #qrcode canvas { display: block; border-radius: 10px; }

        /* 窄屏:退回纵向堆叠 */
        @media (max-width: 380px) {
            .qr-wrap { flex-direction: column; gap: 16px; }
            .qr-left { align-items: center; text-align: center; }
        }

        /* ── 生成器(并入左栏)────────────── */
        .generator {
            display: none;
            width: 100%;
            margin-top: 6px;
            align-self: stretch; /* 撑满左栏,textarea 才能 100% */
        }
        .generator.open { display: block; animation: qr-in 320ms var(--ease-spring) both; }
        /* 胶囊容器:输入框 + 按钮融为一体(§12 材料克制,无边/微融合)。
           纵向布局下占满宽,居中显示 */
        .gen-row {
            display: flex;
            align-items: center;
            width: 100%;
            /* 无间隙:按钮与输入框同底色,视觉一体 */
            gap: 0;
            padding: 8px 8px 8px 22px; /* 更宽内边距,呼吸感 */
            border: none;
            border-radius: 28px; /* 胶囊型大圆角 */
            background: rgba(255, 255, 255, 0.06); /* 微亮深灰,与背景融合 */
            transition: box-shadow 200ms var(--ease-spring), background 200ms var(--ease-spring);
            box-sizing: border-box;
        }
        /* focus-within:容器整体泛起紫色光晕(输入框或按钮获得焦点时) */
        .gen-row:focus-within {
            background: rgba(255, 255, 255, 0.09);
            box-shadow: 0 0 0 3px rgba(106, 92, 255, 0.35), 0 0 24px rgba(106, 92, 255, 0.18);
        }
        .generator input {
            flex: 1;
            min-height: 44px;
            padding: 0;
            border: none;
            background: transparent; /* 融入 gen-row 底色 */
            color: var(--text);
            /* 字体与 hero「向 TA 打个招呼」一致:系统无衬线,非等宽 */
            font-family: var(--font);
            font-size: 17px;
            line-height: 1.5;
            outline: none;
            box-sizing: border-box;
        }
        .generator input::placeholder { color: var(--text-3); }
        /* 极简确认按钮:透明无边框,与输入框同底色融合,仅图标 */
        .gen-btn {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-2);
            cursor: pointer;
            transition: border-color 120ms, color 120ms, background 120ms, transform 120ms var(--ease-spring);
        }
        .gen-btn svg { width: 22px; height: 22px; }
        .gen-btn:hover { color: var(--accent-2); background: rgba(106,92,255,0.12); }
        .gen-btn:active { transform: scale(0.92); }
        .gen-btn:disabled { opacity: 0.35; cursor: default; background: none; }

        /* ── 响应式 ─────────────────────────────── */
        @media (max-width: 480px) {
            .page { padding: 44px 20px 32px; }
            .hello { font-size: 26px; }
            .card { padding: 22px 18px; }
        }

        /* ── 减弱动效 ───────────────────────────── */
        @media (prefers-reduced-motion: reduce) {
            .page, .logo, .card, .qr-body, .generator { animation: none; }
            .cta, .cta .cta-arrow, .download { transition: none; }
        }
    </style>
</head>
<body>
    <main class="page">
        <!-- 品牌区:左 LOGO,右上 PEYT Chat,右下 Type Everything -->
        <div class="brand-block">
            <img class="logo" src="logo.jpg" alt="PEYT">
            <div class="brand-text">
                <div class="brand">PEYT Chat</div>
                <p class="slogan">Type Everything</p>
            </div>
        </div>

        <!-- 问候:hero 独立居中 -->
        <div class="greeting">
            <h1 class="hello">向 <b id="name">TA</b> 打个招呼 👋</h1>
        </div>

        <div class="card" id="card">
            <p class="hint" id="hint">已有 PEYT 直接打开,还没有则先下载</p>

            <a class="cta" id="dc-link" href="">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                打开 PEYT
                <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>

            <a class="download" href="https://peyt.yzjtiantian.cn/download">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                下载 PEYT
            </a>

            <div class="qr-wrap">
                <!-- 二维码在上(无卡片包裹、无扫码标签) -->
                <div class="qr-body" id="qr-body">
                    <div id="qrcode"></div>
                </div>
                <!-- 生成器在下:标题 + 切换 + 输入框 + 按钮 -->
                <div class="qr-left">
                    <div class="qr-title">在另一台设备打开</div>
                    <button class="qr-toggle" id="qr-toggle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                        <span id="qr-toggle-text">显示二维码</span>
                    </button>
                    <!-- 生成器:粘贴链接 → 生成二维码 -->
                    <div class="generator" id="generator">
                        <div class="gen-row">
                            <input id="gen-input" type="text" placeholder="粘贴邀请链接,生成二维码" autocomplete="off" spellcheck="false">
                            <button class="gen-btn" id="gen-btn" aria-label="生成二维码">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 无 JS 兜底
        if (!window.QRCode) document.body.classList.add('no-js');

        var searchParams = new URLSearchParams(window.location.hash.substr(1));
        var nameEl = document.getElementById('name');
        var hintEl = document.getElementById('hint');
        var ctaEl = document.getElementById('dc-link');
        var downloadEl = document.querySelector('.download');
        var qrToggle = document.getElementById('qr-toggle');
        var qrBody = document.getElementById('qr-body');
        var qrEl = document.getElementById('qrcode');
        var qrWrap = document.querySelector('.qr-wrap');
        var genEl = document.getElementById('generator');

        var qrToggleText = document.getElementById('qr-toggle-text');
        qrToggle.addEventListener('click', function () {
            qrBody.classList.toggle('open');
            if (qrToggleText) qrToggleText.textContent = qrBody.classList.contains('open') ? '收起二维码' : '显示二维码';
        });

        function renderInvite(token) {
            // `<FPR>&v=3&i=...` → `OPENPGP4FPR:<FPR>#v=3&i=...`
            var openpgp4fprStr = "OPENPGP4FPR:" + token.replace(/&/, "#");
            ctaEl.setAttribute('href', openpgp4fprStr);
            nameEl.textContent = searchParams.get("g") || searchParams.get("b") || searchParams.get("n") || searchParams.get("a") || "TA";
            // 群邀请:提示行微调
            if (searchParams.get("g") || searchParams.get("b")) {
                hintEl.textContent = '点开加入群聊,或扫码在另一台设备打开';
            }
            // 二维码
            qrEl.innerHTML = '';
            var cv = document.createElement('canvas');
            qrEl.appendChild(cv);
            QRCode.toCanvas(cv, openpgp4fprStr, { width: 200, margin: 1 });
        }

        var token = window.location.hash.substr(1);
        if (token) {
            renderInvite(token);
        } else {
            // 无 token:隐藏 CTA/下载/标题/切换/右栏二维码,只留左栏生成器
            hintEl.style.display = 'none';
            ctaEl.style.display = 'none';
            downloadEl.style.display = 'none';
            document.querySelector('.qr-title').style.display = 'none';
            document.querySelector('.qr-toggle').style.display = 'none';
            qrBody.style.display = 'none';
            genEl.classList.add('open');
        }

        // 生成器:确认按钮 + 回车都触发(点击或按 Enter 生成二维码)
        var genInput = document.getElementById('gen-input');
        var genBtn = document.getElementById('gen-btn');
        genBtn.disabled = true; // 空输入禁用
        function generate() {
            var v = genInput.value.trim();
            if (!v) { genBtn.disabled = true; return; }
            if (v.startsWith('https://peyt.yzjtiantian.cn')) v = v.replace(/https:\/\/peyt\.yzjtiantian\.cn\/?#/, '');
            else if (v.startsWith('https://i.delta.chat')) v = v.replace(/https:\/\/i\.delta\.chat\/?#/, '');
            else v = v.replace(/openpgp4fpr:/i, '');
            if (v.indexOf('#') === -1) v = v.replace(/%23/, '#');
            if (!v) { genBtn.disabled = true; return; }
            // 生成器路径下右栏 qr-body 被隐藏,这里恢复显示,二维码才能看到
            qrBody.style.display = '';
            qrBody.classList.add('open');
            renderInvite(v);
        }
        genBtn.addEventListener('click', generate);
        // 回车绑定:textarea 内按 Enter 生成
        genInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                generate();
            }
        });
        genInput.addEventListener('input', function () {
            genBtn.disabled = !genInput.value.trim();
        });
    </script>
</body>
</html>
